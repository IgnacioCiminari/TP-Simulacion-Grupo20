[package]
name = "rtv-backend"
version = "3.0.0"
edition = "2021"
description = "Backend en Rust de la Simulación de la Planta de Revisión Técnica Vehicular"
publish = false

[lib]
name = "rtv_backend"
path = "src/lib.rs"

# Servidor HTTP (equivalente a `uvicorn api:app`)
[[bin]]
name = "rtv-backend"
path = "src/main.rs"

# CLI de simulación (equivalente a `uv run main.py`)
[[bin]]
name = "simular"
path = "src/bin/simular.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rayon = "1"
# Allocator global: el malloc de musl (imagen alpine) es lento y con lock global.
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
